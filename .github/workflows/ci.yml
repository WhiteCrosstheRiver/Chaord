name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  pr:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[test]
      - name: Grammar sketch check
        run: python tools/sketch_check.py spec/examples/*.chaord
      - name: Magic-number gate (thresholds live in dialects only)
        run: python tools/check_magic_numbers.py
      - name: Fast test suite
        run: |
          set -o pipefail
          python -m pytest tests -m "not slow" -q --tb=short -rA 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}
      - name: Publish failure output to ci-logs branch
        if: failure()
        run: |
          git config user.name "ci-debug" && git config user.email "ci@chaord.local"
          git checkout -B ci-logs
          git add pytest_output.txt || true
          git commit -qm "ci output ${{ matrix.os }} @ ${{ github.sha }}" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/WhiteCrosstheRiver/Chaord.git" ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[test]
      - name: Acceptance A1-A14 (clean machine)
        run: python tools/acceptance.py -o reports/acceptance.json
      - name: Upload clean-machine acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: clean-acceptance-report
          path: reports/
      - name: Slow statistical suite
        run: python -m pytest tests -m "slow" --tb=short
