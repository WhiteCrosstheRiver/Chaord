# metal dialect — metals and ordered intermetallics (M1+).
name: metal
version: "0.2.4"

units: []

keys:
  region_crystal: [prototype, composition, a, c, orient, lattice]
  region_crystal_defect: [defect]

thresholds:
  cn_cutoff: 3.5                  # first-shell coordination cutoff for close-packed metals, A
  defocus_tolerance: 0.3          # displacement below which an atom still occupies its site, A
  # --- EAM physics backend (analytic Finnis-Sinclair form, eV / A) ---
  # V(r) = (r-c)^2 (c0 + c1 r + c2 r^2) for r < c; phi(r) = (r-d)^2 for r < d;
  # E = sum_i [ 1/2 sum_j V(r_ij) - A sqrt(sum_j phi(r_ij)) ]  (Finnis & Sinclair 1984 form).
  # Parameter sets are calibrated in that form to the experimental lattice constant,
  # cohesive energy and bulk modulus (targets in each entry). Cu/Ni are fcc
  # (a = 3.6149 / 3.5241 A, Ecoh = 3.49 / 4.44 eV, B = 137 / 186 GPa), Fe is bcc
  # (a = 2.8664 A, Ecoh = 4.28 eV, B = 168 GPa). Cu/Ni cutoffs keep the neighbour
  # list inside half the smallest cell of a 2x2x4 fcc repeat (64 atoms); Fe keeps
  # third-neighbour pair contributions for bcc shear stability.
  eam_potentials:
    Cu:
      A: 2.613504
      c: 3.25
      d: 3.25
      c0: -2.08679261
      c1: 2.73721320
      c2: -0.60353801
      lattice: fcc
      a_ref: 3.6149             # calibration target, A
      ecoh_ref: 3.49            # calibration target, eV
      bulk_modulus_ref_GPa: 137
    Fe:
      A: 1.765597
      c: 4.4
      d: 3.6
      c0: 1.86699210
      c1: -1.23545947
      c2: 0.21106901
      lattice: bcc
      a_ref: 2.8664
      ecoh_ref: 4.28
      bulk_modulus_ref_GPa: 168
    Ni:
      A: 3.505766
      c: 3.15
      d: 3.15
      c0: -4.74120293
      c1: 5.42168644
      c2: -1.19205176
      lattice: fcc
      a_ref: 3.5241
      ecoh_ref: 4.44
      bulk_modulus_ref_GPa: 186
  # MD for the eam backend: energy in eV, length in A, run_md uses m = kB = 1,
  # so time is in sqrt(u A^2 / eV) ~ 10.18 fs and T is passed in eV (kB T).
  eam_md:
    skin: 0.3                    # neighbour-list skin, A
    relax_steps_fast: 400        # capped-force stage from the packed start
    relax_dt_fast: 0.002
    relax_gamma_fast: 5.0
    fcap: 10.0                   # force cap for close RSA contacts, eV/A
    relax_steps: 600             # default relaxation when the caller gives none
    relax_dt: 0.002
    relax_gamma: 2.0
    reference_T_K: 300           # stated when the program has no state T
    kB_eV_per_K: 8.617333262e-5  # Boltzmann constant, eV/K
  eam_force_symmetry_tol: 1.0e-9 # perfect-lattice residual force, eV/A
  eam_scan_lo: 0.95              # uniform-scale energy scan window (fraction)
  eam_scan_hi: 1.05
  eam_scan_steps: 21
  eam_temperature_band: 0.30     # MD test band around the target temperature
  fluid_rsa_dmin: 2.0            # RSA hard-core placement for metal atoms, A (near-solid
                                 # densities jam above this; close contacts are capped by
                                 # eam_md.fcap during the fast relaxation stage)
  density_match_tolerance: 0.05  # stated vs geometric density mismatch (A12)
  fluid_max_bonded_component: 3   # largest bond-graph component (atoms) still one
                                  # molecule of a single-phase fluid (largest shipped
                                  # template = 3: H2O, CO2); an extended component is
                                  # a second phase (metal slab, network) and lifts as
                                  # interface/amorphous, never as a pseudo-molecule
  # --- M2 defect and solid-solution passes (fractions of the NN distance) ---
  site_match_tol_fraction: 0.35   # atom counts as on-site below this fraction of d_NN
  interstitial_distance_fraction: 0.60
  defect_cluster_rc_fraction: 0.60
  sro_shell1_factor: 1.20         # first-shell cutoff for Warren-Cowley alpha1
  lattice_anchor_improvement: 0.7 # a translation re-anchor of the defect lift
                                   # must improve the mean matched distance by
                                   # at least this factor (rule 3: re-imaged
                                   # inputs anchor; aligned inputs keep the
                                   # origin-anchored fit unchanged)
  sro_print_tolerance: 0.02
  sro_mc_steps: 4000              # SQS-lite swap moves
  defect_stoichiometry_slack: 0.10   # counts may deviate from slot ratio by this fraction
  stoichiometric_preference_min: 0.90 # species-aware fit score to prefer a stoichiometric host
  thermal_test_amplitude: 0.06      # displacement amplitude as fraction of d_NN (0.8 Tm-ish)
  thermal_quench_steps: 100         # max L-BFGS-B iterations of the defect-lift thermal
                                   # quench (review 2, 2026-09-29); 0 disables the quench
  thermal_quench_rc: 2.5            # LJ cutoff of the quench potential, sigma units
  thermal_quench_spring: 400        # harmonic site restraint of the quench, epsilon/sigma^2
  thermal_quench_shift_fraction: 0.15  # per-axis box bound around each matched site,
                                   # x d_NN: keeps free atoms inside the site-match
                                   # tolerance next to unrelaxed planted defects
  lattice_scan_factor_lo: 0.70
  lattice_scan_factor_hi: 2.40
  lattice_scan_steps: 29
  sro_emit_threshold: 0.05        # lift states sro only outside this band
  sro_emit_noise_factor: 3.5      # significance: emit only beyond n x the reshuffle-null std
                                   # (2.5 let a 2.6-sigma fluctuation of a random ternary
                                   #  108-atom solution emit; 3.5 sigma keeps random
                                   #  occupancy silent while genuine SRO still passes)
  sqs_converge_tol: 0.005
  lattice_fit_tol_fraction: 0.15   # tight gate used to rank lattice-constant candidates
  lattice_fit_gate_min: 0.85       # candidate must match at least this fraction of sites
  lattice_refine_half: 0.05        # half-width of the fine lattice-constant search, A
  lattice_refine_steps: 18
  lattice_refine_passes: 3         # successive grid refinements for the constant
  site_plausibility_floor: 0.5     # a host candidate must explain at least this fraction
                                   # of the atoms/sites to count as plausible
  sro_bootstrap_samples: 48       # null reshuffles sizing the SRO emission band
                                   # (8 left a +/-27% error on the null std, enough to
                                   #  flip the emission decision between orderings)
  sro_bootstrap_seed: 20260927
  q6_cutoff: 3.3                    # phase-indicator neighbour cutoff for metals, A.
                                    # 3.0 < d_NN(Mg) = 3.21 A gave Mg frames ZERO
                                    # neighbours, so a crystal read as "not solid"
                                    # and the auto-cascade fell through to the
                                    # fluid lifter (red team F2). 3.3 clears the
                                    # largest close-packed metal d_NN while staying
                                    # inside the Cu first shell (2.556 A x 1.29).
                                    # VALUE CHANGE pending human approval (AGENTS:
                                    # dialect thresholds), post Review 3, 2026-09-30
  cn_cutoff_fluid: 3.5              # overrides core's 3.10 for the metal stack: same
                                    # reason as q6_cutoff (3.10 < d_NN(Mg) zero-bonded
                                    # the fluid census path); aligned with cn_cutoff.
                                    # VALUE CHANGE pending human approval, 2026-09-30
  q6_solid: 0.32
  dislocation_core_radius: 1.2     # inside this the Volterra field is unset, A
  burgers_tol: 0.25                # lattice-step tolerance for the circuit closure
  csl_angle_tol: 2.0               # degrees: misorientation to CSL match (R2 reverted a68e202 widening)
  csl_brandon_theta0: 15.0         # Brandon criterion prefactor, degrees: a detected
                                   # misorientation may sit at most theta0/sqrt(Sigma)
                                   # from the candidate CSL angle, so a Sigma's
                                   # acceptance window is min(csl_angle_tol, this /
                                   # sqrt(Sigma)) -- large-Sigma cells exist only in
                                   # ever narrower windows and a low-angle twist
                                   # emits no Sigma at all.
                                   # Source: Brandon, Acta Metall. 14, 1479 (1966).
  csl_peak_window_deg: 10.0        # half-width of the first-shell angle peak window
                                   # used to refine each grain's orientation, degrees:
                                   # wide enough to average position noise symmetric,
                                   # narrow enough to exclude the cross-grain
                                   # satellite pairs near a boundary
  csl_peak_frac_min: 0.75          # a grain orientation exists only if at least this
                                   # fraction of the half's first-shell in-plane
                                   # angles sit inside the peak window; below it the
                                   # half has no clear orientation (liquid, glass,
                                   # powder) and no grain_boundary is emitted
  gb_shell_length_tol: 0.10        # first-shell vector length band (R2 reverted a68e202 widening)
                                   # as a fraction of the lattice constant
  gb_overlap_fraction: 0.8         # unrelaxed CSL bicrystals remove the upper-grain atom of any
                                   # cross-grain pair closer than this fraction of d_NN (the AGENTS
                                   # reference-data sanity floor: no pair closer than 0.8 d_NN)
  circuit_inset_x: 0.15            # Burgers loop inset from the box x faces
  circuit_inset_y: 0.15            # ... and y faces
  slab_cn_factor: 1.15              # coordination cutoff for family detection, x d_NN
  fcc_cn_min: 10.0                  # interior CN above which the lattice is fcc-like
  burgers_detect_min: 0.30          # |b| detection floor as fraction of a
  burgers_row_link_fraction: 0.5    # row-chain link tolerance, fraction of d_NN
  burgers_row_angle_tol: 5.0        # degrees: lattice-repeat parallelism for row chains
  burgers_step_band: 0.25           # accepted row-step magnitudes, fraction around family |b|
  frenkel_pair_rc_fraction: 0.80  # max vacancy-interstitial separation named frenkel_pair, x d_NN
  # --- interface slab lift and build (M4; A5 fix, 2026-09-29) ---
  # The slab lifter (lift/slab.py decompile) and slab builder (build/slab.py)
  # read their thresholds by name; until 0.2.4 the metal dialect defined none
  # of them and any metal-frames interface lift died on the first read. The
  # values are the lj dialect's semantics converted from sigma to Angstrom at
  # the Cu scale: the LJ fcc solid has a = 1.609 sigma, so d_nn = a/sqrt(2) =
  # 1.138 sigma (1 sigma = 0.879 d_nn); Cu fcc a = 3.615 A gives
  # d_nn = 2.556 A, i.e. 1 sigma ~= 2.246 A. lj values x 2.246 A:
  bulk_margin: 5.6                  # distance kept from interface centres for bulk
                                    # statistics (lj 2.5 sigma = 2.2 d_nn = 5.62 A;
                                    # ~2 Cu nearest-neighbour shells)
  gr_rmax: 5.6                      # g(r) range of the liquid asserts (lj 2.5 sigma
                                    # = 2.2 d_nn; first + second Cu shell)
  gr_bins: 100                      # g(r) bins (as lj)
  angle_hist_bin: 5                 # bond-angle histogram bin width, degrees (as lj)
  defect_cluster_rc: 2.9            # linking distance for empty-site/off-lattice
                                    # complexes (lj 1.3 sigma = 1.14 d_nn = 2.92 A)
  thin_slab_margin_fraction: 0.8    # thin-film degradation (same rule as lj): when
                                    # bulk_margin + gr_rmax does not fit in the
                                    # liquid half-slab, both shrink proportionally
                                    # until they cover at most this fraction of it;
                                    # gr_rmax never drops below cn_cutoff, then the
                                    # margin drops to zero; the shrink is stated as
                                    # a comment on the liquid block
  printed_strain_tolerance: 0.2     # tolerance printed on the strain constrain line, %
                                    # (as lj; percent is dimensionless)
  rsa_dmin: 2.0                     # hard-core distance for random sequential packing
                                    # of atomic species (lj 0.90 sigma = 0.79 d_nn =
                                    # 2.02 A; same rule as fluid_rsa_dmin above)
  rsa_max_packing_fraction: 0.36    # highest hard-sphere volume fraction the RSA
                                    # packer may target (monodisperse RSA saturates
                                    # near 0.38); above it the hard core shrinks to
                                    # the feasible value and eam_md.fcap relaxes the
                                    # closer contacts (same rule as lj)
  rsa_max_tries: 2000000            # total RSA placement attempts before an honest
                                    # ChaordError (never an unbounded spin)
  liquid_margin_shrink: 0.7         # shrink of the liquid half-slab used for packing
                                    # (lj 0.3 sigma = 0.264 d_nn = 0.67 A)
  md_reference_T: 300               # metadata temperature (Kelvin) stated when the
                                    # caller gives none (lj states 0.65 reduced; metal
                                    # physical; same value as eam_md.reference_T_K)
  lattice_spacing_scan: [1.2, 2.4, 0.001]
                                    # (lo, hi, step) of layer-spacing candidates for
                                    # the z-lattice fit, A. core's sigma-scaled
                                    # [0.6, 1.1, 0.0005] covers the LJ fcc(100)
                                    # spacing a/2 = 0.80 sigma; scaled x 2.25 for Cu
                                    # (a/2 = 1.8075 A) and widened to also cover
                                    # fcc(111) 2.09 A and bcc(110) Fe 2.03 A
  slab_packing_margin: 0.05         # atom-atom contact buffer when RSA-packing a
                                    # molecular region against the crystal and itself
                                    # (bench generator protocol: reject below
                                    # bond_tolerance x covalent-radii sum + this), A
  slab_packing_max_tries: 400       # per-molecule RSA placement budget (x n molecules)
