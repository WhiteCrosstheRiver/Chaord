# glass dialect — amorphous solids, melt-quench protocols (M5+).
name: glass
version: "0.1.0"

units: []

keys:
  region_amorphous: [composition, state, history]

thresholds:
  cn_cutoff: 2.85                 # Si-Si first shell, A
  ring_search_max: 12             # largest ring size searched
  bond_tolerance: 1.25              # bond length in units of covalent radii sums
  # VALUE CHANGE (Review 7 / O9, 2026-10-02, PENDING OWNER APPROVAL):
  # 3.0 -> 1.3.  The old 3.0 was meant in oxide-network A, but this dialect
  # is exercised exclusively with the lj backend, whose unit is the sigma
  # (glass.yaml has no unit override; core + glass thresholds apply to LJ
  # frames in A = sigma).  In sigma units 3.0 averages q6 over ~3 neighbour
  # shells, which ERASES the crystal signal (multi-shell q6bar of a perfect
  # fcc crystal measures 0.021, far below q6_solid 0.32), so a perfect fcc
  # crystal passed is_amorphous and lifted as `amorphous glass` (O9).  Unit
  # discipline: the value now states the same first-shell cutoff the lj
  # dialect states (lj.yaml q6_cutoff 1.45 sigma); 1.3 is the widest
  # first-shell cutoff that rejects every prototype crystal at rho* 0.85-1.1
  # (measured q6bar: fcc 0.575, bcc 0.511-0.629, hcp 0.485, diamond 0.629,
  # sc 0.354, all above q6_solid with 12/8/12/4/6 neighbours; at 1.35 hcp
  # picks up its 2nd shell and falls to 0.224 -- below threshold).  If the
  # owner later scopes this dialect to oxide networks in A again, q6_cutoff
  # must be re-derived for that unit (a per-dialect unit override), never
  # set to a value that spans neighbour shells in the frames it classifies.
  q6_cutoff: 1.3                    # phase-indicator cutoff (first neighbour shell, sigma units for LJ frames)
  q6_solid: 0.32
  amorphous_solid_frac_max: 0.30   # q6-solid fraction allowed in an amorphous frame
  amorphous_network_min: 0.60      # fraction of 3-6 coordinated atoms required
  amorphous_bond_factor: 1.35      # geometric bond cutoff as fraction of d_NN (X species)
  fluid_rsa_dmin: 0.90              # RSA hard-core distance for protocol starts (sigma)
  # statistical round-trip observables (noise-floor library, sigma units)
  gr_rmax_fluid: 2.5
  gr_bins_fluid: 60
  cn_cutoff_fluid: 1.50
  # LJ-backend protocol parameters (reduced units; mirrors the lj dialect)
  md:
    skin: 0.3
    fcap: 30.0
    relax_dt: 0.005
    relax_gamma: 0.5
    relax_rc: 2.5
    quench_max_steps: 20000
  md_reference_T: 0.65            # starting Langevin temperature for protocol/restraint runs
  protocol_init_T: 0.1            # temperature of the initial protocol velocities
  quench_default_rate: 0.001      # cooling rate when the program omits `at <rate>`
  # default melt-quench-anneal history the amorphous lifter states (rebuild
  # protocol, LJ reduced units; quench is linear over glass_quench_steps).
  # VALUE CHANGE (Review 3 T3, 2026-10-02, pending human approval): the step
  # counts are the shipped reference generator's N=500 protocol (1500/3000/
  # 2850, per bench/reference/lj_glass provenance: melt/quench are the
  # generator's 1500/3000; the anneal depth 2850 is where the generator's
  # floor-selected frames sit (anneal_eq 1000 + 3 x stride 500 + margin for
  # the N^(2/3) rounding -- the floor's last-two frames per quench are the
  # deepest-annealed, and a rebuild must land at comparable depth to compare
  # honestly) -- the previous 3000/6000/
  # 2000 ran 2x longer than the reference and only passed against the looser
  # N=500 floor; the N=2048 cross-quench floor exposes the mismatch. The
  # lifter scales these base counts by (N / glass_protocol_ref_n)^(2/3)
  # (diffusive mixing, same law as the reference generator's own sizing) and
  # states the scaled numbers in the program's history line.
  glass_melt_T: 2.0
  glass_melt_steps: 1500
  glass_quench_T: 0.01
  glass_quench_steps: 3000
  glass_anneal_T: 0.01
  glass_anneal_steps: 2850
  glass_protocol_ref_n: 500
  # deposit protocol (sigma units)
  deposit_T: 0.65                 # Langevin temperature while depositing (liquid branch:
                                 # cold deposition collapses the voids a 0.9-sigma gap needs)
  deposit_min_gap: 0.90           # min-image distance an inserted atom keeps from all others
  deposit_max_attempts: 10000     # rejection-sampling attempts before declaring no free site
  # cn core restraint (temperature / relaxation loop)
  restrain_cn_steps: 250          # short-MD block per restraint iteration
  restrain_cn_gain: 0.5           # proportional gain: T *= exp(gain * (cn - target))
  restrain_cn_T_lo: 0.05          # coldest trial temperature
  restrain_cn_T_hi: 4.00          # hottest trial temperature (cn at fixed box is a weak,
                                  # saturating function of T; the loop needs the full range)
