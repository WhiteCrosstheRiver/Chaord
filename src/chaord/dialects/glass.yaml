# glass dialect — amorphous solids, melt-quench protocols (M5+).
name: glass
version: "0.1.0"

units: []

keys:
  region_amorphous: [composition, state, history]

thresholds:
  cn_cutoff: 2.85                 # Si-Si first shell, A
  ring_search_max: 12             # largest ring size searched
  bond_tolerance: 1.25              # bond length in units of covalent radii sums
  # W1 (Review 8, decision D10): glass.yaml states NO absolute phase cutoff
  # any more; q6_cutoff is DELETED.  Its history: 3.0 (oxide-network A)
  # averaged q6 over ~3 shells in sigma frames and let a perfect fcc crystal
  # pass is_amorphous (O9); the 1.3 interim was meant in sigma and held no
  # neighbour on an A crystal, so all 9 bench crystals were called amorphous
  # under core + glass.  The classification is unit-free now and its keys
  # live in core.yaml: q_cutoff_factor x the frame's own median d_NN as the
  # neighbour radius, q_min_neighbours before an atom can be crystal-like,
  # q6bar > q6_solid or q4bar > q4_solid, and the crystal lattice fit gates
  # is_amorphous first (crystal_site_coverage_min).
  q6_solid: 0.32
  amorphous_solid_frac_max: 0.30   # q6/q4 crystal-like fraction allowed in an amorphous frame
  amorphous_network_min: 0.60      # fraction of 3-6 coordinated atoms required
  amorphous_bond_factor: 1.35      # geometric bond cutoff as fraction of d_NN (X species)
  fluid_rsa_dmin: 0.90              # RSA hard-core distance for protocol starts (sigma)
  rsa_max_packing_fraction: 0.36    # highest hard-sphere volume fraction the
                                    # RSA packer may target (mirrors lj.yaml;
                                    # the W7 Kob-Andersen glass builds at
                                    # rho*=1.2, where the 0.90 sigma hard core
                                    # is infeasible -- above this fraction the
                                    # hard core shrinks to the feasible value
                                    # and the melt MD relaxes the closer
                                    # contacts; the placement is a prior, not
                                    # the physics)
  rsa_max_tries: 2000000            # total RSA placement attempts before an
                                    # honest ChaordError (mirrors lj.yaml)
  # statistical round-trip observables (noise-floor library, sigma units)
  gr_rmax_fluid: 2.5
  gr_bins_fluid: 60
  cn_cutoff_fluid: 1.50
  # LJ-backend protocol parameters (reduced units; mirrors the lj dialect)
  md:
    skin: 0.3
    fcap: 30.0
    relax_dt: 0.005
    relax_gamma: 0.5
    relax_rc: 2.5
    quench_max_steps: 20000
  md_reference_T: 0.65            # starting Langevin temperature for protocol/restraint runs
  protocol_init_T: 0.1            # temperature of the initial protocol velocities
  quench_default_rate: 0.001      # cooling rate when the program omits `at <rate>`
  # default melt-quench-anneal history the amorphous lifter states (rebuild
  # protocol, LJ reduced units; quench is linear over glass_quench_steps).
  # D7 RE-DERIVED FROM THE KOB-ANDERSEN REFERENCE (W7, 2026-10-04, PENDING
  # OWNER APPROVAL): base counts calibrated on bench/reference/ka_glass
  # (N=2000, rho*=1.2, T* 2.0 -> 0.1) -- glass_protocol_ref_n 2000, so the
  # scale factor at the reference size is 1.0.  Sweep (reports/
  # ka_glass_d7_sweep*.json, 3 rebuild draws per candidate, judged by A5's
  # own averaged protocol against the cross-quench floor): melt 2000 /
  # quench 4000 / anneal 4000 passes at gr_rms x0.86, cn_tv x0.29 and every
  # partial g(r) x0.80-x1.19 of the floor (231 s/draw on the busy dev box,
  # 69 s under the 300 s A5 budget; 10,000 MD steps).  Budget follow-up
  # (2026-10-04): the same box under load measured 366 s/draw, over that
  # budget -- the A5 budget is now step-aware (acceptance._a5_budget reads
  # the history line's stated step counts; 10,000 steps at N=2000 -> 600 s).  The previous
  # provisional values (1500/3000/2850 at ref_n 500, calibrated on the
  # retired monatomic N=500 generator) under-anneal at the KA state point:
  # their scaled protocol (3780/7560/7182 at N=2000) was not swept, but the
  # 5x-faster-quench candidate A (4000/4000/1000) failed gr_rms at x1.81
  # and the 100-step-anneal truncation at x6.94 -- anneal depth is the
  # binding knob, and quench_end/anneal temperatures move 0.01 -> 0.1 with
  # the reference's protocol.  The lifter scales these base counts by
  # (N / glass_protocol_ref_n)^(2/3) and states the scaled numbers in the
  # program's history line.
  glass_melt_T: 2.0
  glass_melt_steps: 2000
  glass_quench_T: 0.1
  glass_quench_steps: 4000
  glass_anneal_T: 0.1
  glass_anneal_steps: 4000
  glass_protocol_ref_n: 2000
  # deposit protocol (sigma units)
  deposit_T: 0.65                 # Langevin temperature while depositing (liquid branch:
                                 # cold deposition collapses the voids a 0.9-sigma gap needs)
  deposit_min_gap: 0.90           # min-image distance an inserted atom keeps from all others
  deposit_max_attempts: 10000     # rejection-sampling attempts before declaring no free site
  # cn core restraint (temperature / relaxation loop)
  restrain_cn_steps: 250          # short-MD block per restraint iteration
  restrain_cn_gain: 0.5           # proportional gain: T *= exp(gain * (cn - target))
  restrain_cn_T_lo: 0.05          # coldest trial temperature
  restrain_cn_T_hi: 4.00          # hottest trial temperature (cn at fixed box is a weak,
                                  # saturating function of T; the loop needs the full range)
