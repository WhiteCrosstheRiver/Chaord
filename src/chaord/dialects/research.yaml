# research dialect — the field observables of the first post-gate research
# case (docs/reviews/open_items_v2.md, section 5 "After the gate: first
# research use"): carbonate solvents confined in a carbon nanotube under an
# external electric field. The reviewer's binding: "Add what the field
# changes that can be measured: a dipole-orientation order parameter and the
# radial density profile."
#
# This dialect holds ONLY the measurement keys the observables of
# chaord/cv/field.py read. The language statements of the research case
# (cylindrical region, nanotube description, external-field statement) live
# in the language layer and the dialects that own that vocabulary; nothing
# here defines statement keys.
name: research
version: "0.1.0"

units: []   # no new units: lengths, densities and charges are in the
            # system's own units (A and e under the molecular stack)

keys:
  # D29 (docs/reviews/open_items_v4.md): `assert dipole_p1 <v> +- <tol>
  # along <axis>` in the system block, next to `state T` (and next to the
  # assumed `state field` line when the caller supplied one -- RD3,
  # carbon.yaml), measured by the CV the thresholds below define. The
  # statement is BLIND: the lift measures it for every frame whose dialect
  # names dipolar species, with or without field=.
  system: [dipole_p1]
  # D36 (docs/reviews/open_items_v4.md Y5): the electrolyte statements the
  # composed lift prints in a confined-liquid region (the tube interior):
  # the Li+ solvation shell by species (`assert li_shell C3H4O3 2.5 +- 0.5
  # carbonyl_O 2.45 A`), the ion-pair classes (`assert ion_pairs SSIP 1
  # CIP 1 AGG 0`), the species radial number-density profile inside the
  # tube radius (`state n_r C3H4O3 0.0000 ... bin 0.5 A`) and the linear
  # density next to the accessible-volume density (`state linear_density
  # 0.346 A^-1`). Measured by chaord/cv/field.py (solvation_shell,
  # species_radial_profiles); every number they read lives below.
  region_liquid: [li_shell, ion_pairs, n_r, linear_density]

thresholds:
  # --- dipole-orientation order parameter (cv/field.py dipole_orientation).
  # P1 = <cos theta>, theta the angle between each molecule's dipole moment
  # and the analysis axis, averaged over the molecules of the named species.
  field_dipole_species: [H2O]  # census formulas (canonical, as the bond-graph
                               # census prints them) of the molecules P1
                               # averages over -- the solvent. The research
                               # case's C3H4O3 (EC) / PC / EMC join when
                               # their site-charge models are pinned; the
                               # table below is keyed by ELEMENT, and EC's
                               # carbons carry two different published
                               # charges (Nutakki 2023 Table III: CO +0.99,
                               # CT +0.22 e), so an element table cannot
                               # express the model. The first-result round
                               # (RD4, 2026-10-14) therefore passes the
                               # carbonate species as a pipeline-level
                               # measurement view over this dialect (the
                               # research dumps carry per-atom charges, which
                               # win over the table, so the table is never
                               # consulted there); the default list stays
                               # [H2O] until a per-site charge table exists.
  dipole_axis_default: z       # the analysis axis of `assert dipole_p1`
                               # when no field names one and the program
                               # holds no nanotube region (D29/Y2: the runs
                               # of this dialect confine fluids in z-aligned
                               # tubes, so z is the axis an honest blind
                               # statement measures against; the nanotube
                               # region's own axis wins once Y3's
                               # composition emits it)
  field_dipole_site_charges:   # per-ELEMENT site charges in e, keyed by
                               # census formula, used when the frame itself
                               # carries no charges (see field.py: a
                               # per-atom `charges` array in frame.info --
                               # what the LAMMPS reader of the research case
                               # records -- always wins; the table is the
                               # fallback). Every entry must be neutral: the
                               # orientation of a charged species depends on
                               # the arbitrary origin, so a non-neutral entry
                               # is refused at read time (checked against
                               # field_charge_tolerance).
    H2O:
      O: -0.8476               # SPC/E water, q_O = -0.8476 e and q_H =
      H: 0.4238                # +0.4238 e -- H. J. C. Berendsen, J. R.
                               # Grigera, T. P. Straatsma, J. Phys. Chem.
                               # 91, 6269 (1987): the same published set the
                               # molecular dialect's water_models table
                               # records (one source, two readers).
  field_charge_tolerance: 1.0e-3   # max |sum of one formula's site charges|, e:
                                   # fail-closed bound on charge-model typos
                                   # in field_dipole_site_charges
  field_dipole_moment_floor: 1.0e-3   # a molecule whose |mu| (e x the system's
                                   # length unit) falls at or below this has
                                   # no orientation; the measurement refuses
                                   # instead of averaging an arbitrary
                                   # direction (a zero-dipole species named
                                   # in field_dipole_species is a
                                   # configuration error, not a P1 of 0)
  # --- radial density profile (cv/field.py radial_density_profile).
  # Cylindrical number density n(r) about the field axis through the cell
  # centre, binned from r = 0 to r_max = half the shorter transverse cell
  # edge (the largest inscribed cylinder; beyond it the periodic corners
  # double-count and the shell normalisation breaks).
  radial_profile_bins: 20      # cylindrical bins from the axis to r_max
                               # (dimensionless count)
  radial_profile_inner_fraction: 0.5   # inner/outer split at this fraction of
                               # r_max for the summary scalar
                               # radial_inner_outer_ratio: mean density of
                               # the bins with r_centre <= fraction x r_max
                               # over the mean of the rest -- 1 in a
                               # homogeneous system, > 1 when confinement or
                               # a solvation shell piles solvent near the
                               # axis, < 1 when the axis is depleted. The
                               # scalar is the distance()-friendly summary;
                               # the raw profile array ships alongside it.
  # --- Li+ solvation shell (cv/field.py solvation_shell; D36, Y5). The
  # shell is counted by SPECIES on named sites, and the ion pairs are
  # classified SSIP (no anion in the first shell) / CIP (an anion contacted
  # by exactly one Li+) / AGG (an anion shared by two or more Li+).
  li_shell_cation: Li          # census element of the cation whose first
                               # solvation shell the statements measure
                               # (monatomic in the census: the bond graph
                               # never bonds through ion_solvation_elements)
  li_shell_anion: F6P          # census formula of the counter-anion whose
                               # contacts define the SSIP/CIP/AGG classes
  li_shell_sites:              # census formula -> first-shell site rule
    C3H4O3: carbonyl_O         # EC: the carbonyl O (the O whose single
    C4H8O3: carbonyl_O         # heavy-atom neighbour is a carbonate C with
                               # three O neighbours; EC and EMC each hold
                               # exactly one -- build/molecules.py
                               # carbonyl_oxygen_sites). The ether Os never
                               # solvate Li+ directly in this model family.
    F6P: F                     # PF6-: every fluorine
  # Cutoffs: the first minimum of the Li-O and Li-F g(r) of the REFERENCE
  # zero-field runs (D36: never measured on the frames under test).
  # PROVISIONAL -- pending the Stage A zero-field runs (Y6); today's source
  # is the pilot's zero-field EQUILIBRATION trajectories, which are not
  # part of the 84 production frames the statements are measured on:
  # runs/cnt10_field0/equil.dump + runs/cnt16_field0/equil.dump, 17 frames
  # each, 2 + 6 Li+, 136 Li-ion frames in total. Estimator (recomputed and
  # pinned by tests/test_electrolyte_statements.py
  # ::test_solvation_cutoffs_match_the_zero_field_reference_runs):
  # Li-O(carbonyl of EC+EMC pooled) and Li-F g(r) in 0.1 A bins, each frame
  # normalised by its own site count in the geometric pore volume pi R^2 Lz
  # (R 6.78135 / 10.85015 A from the runs' provenance), averaged over the
  # 34 frames; cutoff = the first local minimum after the first peak.
  #   Li-O(carbonyl): first peak 1.95 A (g 157.4), first minimum 2.45 A
  #                   (g 0.00); mean first shell 3.88 O per Li+
  #   Li-F:           first peak 1.95 A (g 26.3), first minimum 2.45 A
  #                   (g 1.31); mean first shell 0.60 F per Li+
  # Stage A replaces both when its zero-field runs land.
  li_shell_cutoffs:
    C3H4O3: 2.45               # A, Li-O(carbonyl of EC)
    C4H8O3: 2.45               # A, Li-O(carbonyl of EMC)
    F6P: 2.45                  # A, Li-F
  # --- species radial number-density profiles inside the tube radius
  # (cv/field.py species_radial_profiles; Y5 item 3): cylindrical shells of
  # molecule centres from the tube axis to the tube radius.
  species_nr_bin_width: 0.5    # A, radial bin width of `state n_r` lines
  # --- density on the accessible volume (Y5 item 4): the confined fluid's
  # density statement refers to pi (R - r_wall)^2 Lz, the pore volume the
  # pilot generator itself used for its vdw pore record (build_systems.py
  # R_vdw = R - 3.2: sigma_C/2 1.7 A of the Werder sp2-carbon wall plus the
  # typical O half-width 1.5 A; provenance pore_volume_vdw_nm3), with the
  # linear density (molecules per A of tube axis) stated next to it.
  pore_wall_exclusion: 3.2     # A, r_wall: the wall's van der Waals
                               # exclusion depth subtracted from the tube
                               # radius for the accessible volume
