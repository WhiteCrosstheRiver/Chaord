# surface dialect — surfaces, terminations, adsorbates (M4+).
name: surface
version: "0.1.0"

units: []

keys:
  region_crystal: [surface, termination, reconstruction]

thresholds:
  adsorbate_site_tolerance: 0.5   # distance for assigning an adsorbate to a site, A
  layer_tolerance: 0.5            # vertical tolerance defining the surface layer, A
  adsorbate_height: 2.0            # adsorbate height above the top layer, A
  surface_default_layers: 4        # slab thickness in oriented z periods
  surface_default_vacuum: 12.0     # vacuum added above the slab, A
  vacuum_density_max: 0.005        # atoms/A^3 above which a region is not vacuum
  adsorbate_site_tol: 0.8          # lateral tolerance for site classification, A
  vacuum_gap_min: 6.0              # empty z-span above which a vacuum is declared, A
  adsorbate_detect_height: 2.5     # above the top layer: adsorbate, below: slab
  vacuum_interface_width: 2.0      # width printed for the slab|vacuum interface
  slab_cn_factor: 1.15              # interior coordination cutoff as fraction of d_NN
  fcc_cn_min: 10.0                  # interior CN above which the slab is fcc-like
  bcc_cn_min: 6.5                   # ... and bcc-like
  # --- Wood reconstruction recognition ---
  wood_commensurate_tol: 0.15      # max |coeff - integer| for a commensurate overlayer net
  wood_ratio_tolerance: 0.05       # relative tolerance for sqrt(n) length ratios in Wood text
  wood_angle_tolerance: 2.0        # degrees: rotation-angle rounding for Wood text, deg
  # --- primitive-net search (surface and substrate layers) ---
  net_length_tol: 0.1              # relative projected-length match when rejecting a
                                   # collinear candidate net vector
  net_cell_area_tol: 0.2           # net cell area vs points-per-area of the layer
  net_collinear_tol: 0.2           # cross-product area fraction above which two net
                                   # vectors count as independent
  layer_dense_fraction: 0.5        # layer counts as dense at this fraction of the
                                   # biggest layer (bulk-species census)
  layer_surface_fraction: 0.5      # layer qualifies as the surface at this fraction
                                   # of the median layer size
  # --- prototype (compound-terminated) slabs ---
  surface_miller_candidates:       # Miller planes tried when identifying a prototype slab
    - [0, 0, 1]
    - [1, 0, 0]
    - [1, 1, 0]
    - [1, 0, 1]
  surface_net_ratio_tolerance: 0.12   # relative length-ratio match for the surface net
  surface_net_angle_tolerance: 8.0    # degrees: net-angle match for the surface net, deg
  termination_scan_steps: 20          # cut-origin scan steps over one interplanar spacing
  surface_termination_names:          # element -> compound termination name
    O: bridging_O
