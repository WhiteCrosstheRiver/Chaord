# lj dialect — Lennard-Jones reduced units (m = kB = 1).
name: lj
version: "0.1.0"

units: []   # dimensionless; core units still parse but are unused here

keys:
  system: [cell, pbc, seed]

thresholds:
  q6_solid: 0.32                  # Lechner-Dellago averaged q6 above this = solid-like
  q6_cutoff: 1.45                 # neighbour cutoff for q6 (in sigma)
  bulk_margin: 2.5                # distance kept from interface centres for bulk statistics
  thin_slab_margin_fraction: 0.8  # thin-film degradation (A5 fix, 2026-09-29): when
                                  # bulk_margin + gr_rmax does not fit in the liquid
                                  # half-slab, both shrink proportionally until they
                                  # cover at most this fraction of it (the rest is the
                                  # statistics zone); gr_rmax never drops below
                                  # cn_cutoff, then the margin drops to zero -- a film
                                  # thinner than cn_cutoff has no honest statistics
                                  # and raises. The shrink is stated as a comment on
                                  # the liquid block of the lifted program.
  cn_cutoff: 1.50                 # coordination cutoff (first-shell, ~first g(r) minimum)
  gr_rmax: 2.5                    # g(r) range
  gr_bins: 100
  angle_hist_bin: 5               # bond-angle histogram bin width, degrees
  defect_cluster_rc: 1.3          # linking distance for empty-site/off-lattice complexes
  rsa_dmin: 0.90                  # hard-core distance for random sequential packing
  rsa_max_packing_fraction: 0.36  # highest hard-sphere volume fraction the RSA
                                  # packer may target (monodisperse RSA saturates
                                  # near 0.38; 0.36 keeps completion inside the
                                  # build budget). Above it the placement hard
                                  # core shrinks to the feasible value and the MD
                                  # prior (md.fcap) relaxes the closer contacts --
                                  # the placement is a prior, not the physics
                                  # (A5 fix, 2026-09-29: the thin-frame liquid
                                  # packs at rho ~1.1, infeasible at 0.90 sigma)
  rsa_max_tries: 2000000          # total RSA placement attempts before an honest
                                  # ChaordError (never an unbounded spin)
  liquid_margin_shrink: 0.3       # shrink of the liquid half-slab used for packing
  overlap_tolerance: 0.70         # static overlap check, in sigma
  md:
    skin: 0.3
    relax_rc: 2.5                # neighbour cutoff for protocol/relaxation MD, sigma
    relax_steps_fast: 400
    relax_dt_fast: 0.001
    relax_gamma_fast: 5.0
    fcap: 30.0
    relax_steps: 7000            # slow-stage equilibration steps, sized for the largest MD
                                 # reference fluid (lj_liquid_large, N=2048): erasing the
                                 # RSA-packed start is diffusive, t_mix ~ L^2 and the cubic
                                 # edge grows as N^(1/3), so the 2400 steps that equilibrate
                                 # N=500 need 2400 x (2048/500)^(2/3) = 6144 at N=2048
                                 # (measured, seed 7 = the acceptance rebuild seed: cn_tv
                                 # 3.2x floor at 2400 steps, 0.6x floor at 7400; the slab
                                 # interface-width rebuild of the prototype snapshot, M4,
                                 # also stays inside its gate at 7400 -- that width is a
                                 # noisy single-frame draw, so the count was verified
                                 # against that gate directly, not assumed).
                                 # Deliberately N-flat: the A5 verifier reads a rebuild's
                                 # md_steps as relax_steps_fast + relax_steps -- a static
                                 # dialect sum -- so an N-dependent step count inside the
                                 # builder would make that metadata lie. Smaller systems
                                 # simply over-equilibrate at ~4x lower cost per step.
    relax_steps_base: 2400       # sizing basis: steps that equilibrate relax_steps_ref_n atoms
    relax_steps_ref_n: 500       # sizing basis count (reference/lj_liquid)
    relax_steps_exp: 0.6666667   # t_mix ~ L^2 ~ N^(2/3): diffusive mixing of the packed start
    relax_dt: 0.005
    relax_gamma: 0.5
    quench_max_steps: 20000      # cap on quench integration steps (mirrors glass)
  printed_cutoff: "2.5"          # cutoff the lifter states in physics (metadata)
  printed_strain_tolerance: 0.2  # tolerance printed on the strain constrain line
  default_cutoff: 2.5            # build-side default when physics.cutoff is absent
  md_reference_T: 0.65           # metadata temperature stated when the caller gives none
  cn_cutoff_fluid: 1.50             # first shell in LJ units
  gr_rmax_fluid: 2.5
  gr_bins_fluid: 60
  fluid_rsa_dmin: 0.90
  fluid_solid_fraction_max: 0.20    # above this solid fraction it is not one phase
  restrain_max_iter: 20            # density-restraint box-relaxation iterations
  quench_max_steps: 20000          # cap on quench integration steps
  protocol_init_T: 0.1             # temperature of the initial protocol velocities
  quench_default_rate: 0.001       # cooling rate when the program omits `at <rate>`
  noise_gr_rmin: 0.8               # g(r) RMS lower edge, sigma
  lj_tmelting: 0.69                # fcc LJ melting temperature, reduced units (A4 anchor)
  lattice_scan_steps: 57           # thermal LJ frames bias d_NN (nearest of 12 neighbours) low by
                                   # ~10%, halving the scan step keeps a grid point inside the
                                   # site-match gate peak around the true lattice constant
